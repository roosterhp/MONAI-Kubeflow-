apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-statefulset-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: kubeflow-storage
  hostPath:
    path: /data/mysql-statefulset
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - minikube  # Changed for Minikube
