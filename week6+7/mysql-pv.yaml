apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-statefulset-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  storageClassName: kubeflow-storage
  hostPath:
    path: /data/mysql-statefulset
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s-master-1  # Change this to your node name if different
