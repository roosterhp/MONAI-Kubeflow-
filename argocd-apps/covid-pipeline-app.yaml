apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: covid-detection-pipeline
  namespace: argocd
  labels:
    pipeline: covid-detection
    version: v1.0.0
spec:
  project: ml-pipelines
  source:
    repoURL: https://github.com/roosterhp/MONAI-Kubeflow-
    targetRevision: v1.0.0  # Points to git tag
    path: manifests/pipelines/covid-detection/versions/v1.0.0
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: false  # Manual sync for production pipelines
    syncOptions:
      - CreateNamespace=true
