name: Pipeline CI Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install black flake8 isort

      - name: Run black
        run: black --check hospital-mlops/covid-demo/components/

      - name: Run flake8
        run: flake8 hospital-mlops/covid-demo/components/ --max-line-length=120

      - name: Run isort
        run: isort --check-only hospital-mlops/covid-demo/components/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd hospital-mlops/covid-demo
          pip install -r config/requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          cd hospital-mlops/covid-demo
          pytest tests/ --cov=components --cov-report=xml || echo "Tests not yet implemented"

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./hospital-mlops/covid-demo/coverage.xml
        continue-on-error: true

  compile-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install KFP SDK
        run: pip install kfp==2.0.5

      - name: Compile pipeline
        run: |
          cd hospital-mlops/covid-demo
          python -c "from kfp import compiler; from pipeline import covid_pipeline; compiler.Compiler().compile(covid_pipeline, 'pipeline.yaml')" || echo "Pipeline compilation requires fixes"

      - name: Validate pipeline YAML
        run: |
          test -f hospital-mlops/covid-demo/pipeline.yaml && echo "Pipeline compiled successfully" || echo "Pipeline YAML not found, needs manual review"
