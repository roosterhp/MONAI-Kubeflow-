name: Pipeline CI Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install black flake8 isort

      - name: Check code formatting with black
        run: |
          black --check hospital-mlops/covid-demo/components/ || (echo "::warning::Code formatting issues - run 'black .' to fix" && exit 0)

      - name: Lint with flake8
        run: |
          flake8 hospital-mlops/covid-demo/components/ --max-line-length=120 --ignore=E501,W503,E203 --count --statistics || (echo "::warning::Linting issues found" && exit 0)

      - name: Check import sorting
        run: |
          isort --check-only hospital-mlops/covid-demo/components/ --profile black || (echo "::warning::Import sorting issues - run 'isort .' to fix" && exit 0)

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          pip install pytest pytest-cov

      - name: Run placeholder tests
        run: |
          cd hospital-mlops/covid-demo
          pytest tests/ -v --tb=short
        continue-on-error: false

  compile-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install KFP SDK
        run: pip install kfp==2.0.5

      - name: Check pipeline.py exists
        run: |
          if [ -f hospital-mlops/covid-demo/pipeline.py ]; then
            echo "✓ pipeline.py found"
          else
            echo "✓ pipeline.py will be created in future phases"
          fi
