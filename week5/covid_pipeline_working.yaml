apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: covid-detection-working-
  annotations:
    pipelines.kubeflow.org/kfp_sdk_version: 2.14.6
    pipelines.kubeflow.org/pipeline_spec: '{"description": "COVID-19 Detection Pipeline - Working Version", "name": "COVID-19 Detection Working"}'
spec:
  serviceAccountName: argo
  entrypoint: covid-pipeline
  arguments:
    parameters:
    - name: input_dir
      value: /mnt/data/weekly_input
    - name: output_dir
      value: /mnt/data/hospital_output

  volumes:
  - name: covid-data-volume
    persistentVolumeClaim:
      claimName: covid-data-pvc

  templates:
  - name: covid-pipeline
    inputs:
      parameters:
      - name: input_dir
      - name: output_dir
    dag:
      tasks:
      # Patient 1
      - name: load-patient-1
        template: load-data
        arguments:
          parameters:
          - name: input_dir
            value: "{{inputs.parameters.input_dir}}"
          - name: patient_id
            value: lung_001

      - name: segment-patient-1
        template: segment-lungs
        dependencies: [load-patient-1]
        arguments:
          parameters:
          - name: load_result
            value: "{{tasks.load-patient-1.outputs.result}}"
          - name: patient_id
            value: lung_001

      - name: detect-patient-1
        template: detect-covid
        dependencies: [segment-patient-1]
        arguments:
          parameters:
          - name: segment_result
            value: "{{tasks.segment-patient-1.outputs.result}}"
          - name: patient_id
            value: lung_001

      - name: visualize-patient-1
        template: create-viz
        dependencies: [detect-patient-1]
        arguments:
          parameters:
          - name: detect_result
            value: "{{tasks.detect-patient-1.outputs.result}}"
          - name: patient_id
            value: lung_001
          - name: output_dir
            value: "{{inputs.parameters.output_dir}}"

      # Patient 2
      - name: load-patient-2
        template: load-data
        arguments:
          parameters:
          - name: input_dir
            value: "{{inputs.parameters.input_dir}}"
          - name: patient_id
            value: lung_002

      - name: segment-patient-2
        template: segment-lungs
        dependencies: [load-patient-2]
        arguments:
          parameters:
          - name: load_result
            value: "{{tasks.load-patient-2.outputs.result}}"
          - name: patient_id
            value: lung_002

      - name: detect-patient-2
        template: detect-covid
        dependencies: [segment-patient-2]
        arguments:
          parameters:
          - name: segment_result
            value: "{{tasks.segment-patient-2.outputs.result}}"
          - name: patient_id
            value: lung_002

      - name: visualize-patient-2
        template: create-viz
        dependencies: [detect-patient-2]
        arguments:
          parameters:
          - name: detect_result
            value: "{{tasks.detect-patient-2.outputs.result}}"
          - name: patient_id
            value: lung_002
          - name: output_dir
            value: "{{inputs.parameters.output_dir}}"

      # Patient 3
      - name: load-patient-3
        template: load-data
        arguments:
          parameters:
          - name: input_dir
            value: "{{inputs.parameters.input_dir}}"
          - name: patient_id
            value: lung_003

      - name: segment-patient-3
        template: segment-lungs
        dependencies: [load-patient-3]
        arguments:
          parameters:
          - name: load_result
            value: "{{tasks.load-patient-3.outputs.result}}"
          - name: patient_id
            value: lung_003

      - name: detect-patient-3
        template: detect-covid
        dependencies: [segment-patient-3]
        arguments:
          parameters:
          - name: segment_result
            value: "{{tasks.segment-patient-3.outputs.result}}"
          - name: patient_id
            value: lung_003

      - name: visualize-patient-3
        template: create-viz
        dependencies: [detect-patient-3]
        arguments:
          parameters:
          - name: detect_result
            value: "{{tasks.detect-patient-3.outputs.result}}"
          - name: patient_id
            value: lung_003
          - name: output_dir
            value: "{{inputs.parameters.output_dir}}"

      # Patient 4
      - name: load-patient-4
        template: load-data
        arguments:
          parameters:
          - name: input_dir
            value: "{{inputs.parameters.input_dir}}"
          - name: patient_id
            value: lung_004

      - name: segment-patient-4
        template: segment-lungs
        dependencies: [load-patient-4]
        arguments:
          parameters:
          - name: load_result
            value: "{{tasks.load-patient-4.outputs.result}}"
          - name: patient_id
            value: lung_004

      - name: detect-patient-4
        template: detect-covid
        dependencies: [segment-patient-4]
        arguments:
          parameters:
          - name: segment_result
            value: "{{tasks.segment-patient-4.outputs.result}}"
          - name: patient_id
            value: lung_004

      - name: visualize-patient-4
        template: create-viz
        dependencies: [detect-patient-4]
        arguments:
          parameters:
          - name: detect_result
            value: "{{tasks.detect-patient-4.outputs.result}}"
          - name: patient_id
            value: lung_004
          - name: output_dir
            value: "{{inputs.parameters.output_dir}}"

  # Component Templates
  - name: load-data
    inputs:
      parameters:
      - name: input_dir
      - name: patient_id
    script:
      image: python:3.10-slim
      volumeMounts:
        - name: covid-data-volume
          mountPath: /mnt/data
      command: [python]
      source: |
        import json
        import sys
        from pathlib import Path

        input_dir = "{{inputs.parameters.input_dir}}"
        patient_id = "{{inputs.parameters.patient_id}}"

        print(f"[LOAD] Processing patient: {patient_id}", file=sys.stderr)
        print(f"[LOAD] Input directory: {input_dir}", file=sys.stderr)

        try:
            input_path = Path(input_dir)
            if not input_path.exists():
                raise FileNotFoundError(f"Input directory not found: {input_dir}")

            nifti_file = input_path / f"{patient_id}.nii.gz"
            if not nifti_file.exists():
                raise FileNotFoundError(f"NIfTI file not found: {nifti_file}")

            file_size = nifti_file.stat().st_size
            print(f"[LOAD] Found NIfTI file: {nifti_file}", file=sys.stderr)
            print(f"[LOAD] File size: {file_size:,} bytes", file=sys.stderr)

            result = {
                "component": "load_data",
                "patient_id": patient_id,
                "nifti_file": str(nifti_file),
                "file_size_bytes": file_size,
                "status": "completed",
                "message": f"Successfully loaded {patient_id}"
            }

            print(json.dumps(result))

        except Exception as e:
            result = {
                "component": "load_data",
                "patient_id": patient_id,
                "status": "failed",
                "error": str(e)
            }
            print(json.dumps(result))
            sys.exit(1)
      resources:
        requests:
          memory: 512Mi
          cpu: 500m
        limits:
          memory: 512Mi
          cpu: 500m

  - name: segment-lungs
    inputs:
      parameters:
      - name: load_result
      - name: patient_id
    script:
      image: python:3.10-slim
      volumeMounts:
        - name: covid-data-volume
          mountPath: /mnt/data
      command: [python]
      source: |
        import json
        import sys

        load_result = """{{inputs.parameters.load_result}}"""
        patient_id = "{{inputs.parameters.patient_id}}"

        print(f"[SEGMENT] Starting segmentation for: {patient_id}", file=sys.stderr)

        try:
            load_data = json.loads(load_result)
            if load_data.get("status") != "completed":
                raise ValueError(f"Load data failed: {load_data.get('error', 'Unknown')}")

            # Simulate lung segmentation
            import random
            random.seed(hash(patient_id) % 1000)
            lung_volume = random.randint(7000000, 9000000)

            result = {
                "component": "lung_segmentation",
                "patient_id": patient_id,
                "load_status": "completed",
                "lung_volume": lung_volume,
                "right_lung": int(lung_volume * 0.55),
                "left_lung": int(lung_volume * 0.45),
                "status": "completed",
                "message": f"Segmented lungs for {patient_id}"
            }

            print(f"[SEGMENT] Success for {patient_id} - Volume: {lung_volume:,}", file=sys.stderr)
            print(json.dumps(result))

        except Exception as e:
            result = {
                "component": "lung_segmentation",
                "patient_id": patient_id,
                "status": "failed",
                "error": str(e)
            }
            print(json.dumps(result))
            sys.exit(1)
      resources:
        requests:
          memory: 1Gi
          cpu: "1"
        limits:
          memory: 1Gi
          cpu: "1"

  - name: detect-covid
    inputs:
      parameters:
      - name: segment_result
      - name: patient_id
    script:
      image: python:3.10-slim
      volumeMounts:
        - name: covid-data-volume
          mountPath: /mnt/data
      command: [python]
      source: |
        import json
        import sys

        segment_result = """{{inputs.parameters.segment_result}}"""
        patient_id = "{{inputs.parameters.patient_id}}"

        print(f"[DETECT] Starting COVID detection for: {patient_id}", file=sys.stderr)

        try:
            seg_data = json.loads(segment_result)
            if seg_data.get("status") != "completed":
                raise ValueError(f"Segmentation failed: {seg_data.get('error', 'Unknown')}")

            # Simulate COVID detection
            import random
            random.seed(hash(patient_id) % 100)
            infection_ratio = random.uniform(0.05, 0.35)

            if infection_ratio > 0.25:
                likelihood = "HIGH"
                probability = int(75 + random.uniform(0, 20))
                recommendation = "Urgent radiologist review required"
            elif infection_ratio > 0.15:
                likelihood = "MODERATE"
                probability = int(50 + random.uniform(0, 25))
                recommendation = "Radiologist review within 24 hours"
            else:
                likelihood = "LOW"
                probability = int(20 + random.uniform(0, 30))
                recommendation = "Consider follow-up imaging in 3-5 days"

            result = {
                "component": "covid_detection",
                "patient_id": patient_id,
                "diagnosis": {
                    "likelihood": likelihood,
                    "probability": probability,
                    "recommendation": recommendation
                },
                "infection_ratio": infection_ratio,
                "status": "completed",
                "message": f"COVID detection completed for {patient_id}"
            }

            print(f"[DETECT] Success for {patient_id} - {likelihood} ({probability}%)", file=sys.stderr)
            print(json.dumps(result))

        except Exception as e:
            result = {
                "component": "covid_detection",
                "patient_id": patient_id,
                "status": "failed",
                "error": str(e)
            }
            print(json.dumps(result))
            sys.exit(1)
      resources:
        requests:
          memory: 512Mi
          cpu: 500m
        limits:
          memory: 1Gi
          cpu: "1"

  - name: create-viz
    inputs:
      parameters:
      - name: detect_result
      - name: patient_id
      - name: output_dir
    script:
      image: python:3.10-slim
      volumeMounts:
        - name: covid-data-volume
          mountPath: /mnt/data
      command: [bash]
      source: |
        pip install --quiet matplotlib numpy
        python << 'EOF'
        import json
        import sys
        from pathlib import Path

        detect_result = """{{inputs.parameters.detect_result}}"""
        patient_id = "{{inputs.parameters.patient_id}}"
        output_dir = "{{inputs.parameters.output_dir}}"

        print(f"[VIZ] Creating visualization for: {patient_id}", file=sys.stderr)

        try:
            detect_data = json.loads(detect_result)
            if detect_data.get("status") != "completed":
                raise ValueError(f"Detection failed: {detect_data.get('error', 'Unknown')}")

            diagnosis = detect_data.get("diagnosis", {})
            likelihood = diagnosis.get("likelihood", "UNKNOWN")
            probability = diagnosis.get("probability", 0)

            # Create visualization
            import matplotlib
            matplotlib.use("Agg")
            import matplotlib.pyplot as plt

            fig, ax = plt.subplots(figsize=(8, 6))
            fig.suptitle(f"COVID-19 Analysis - {patient_id}", fontsize=14, fontweight="bold")

            stages = [
                ("1. Load Data", "✓", "green"),
                ("2. Segment Lungs", "✓", "blue"),
                ("3. Detect COVID", "✓", "orange"),
                ("4. Visualization", "✓", "purple")
            ]

            for i, (step, status, color) in enumerate(stages):
                y_pos = 0.8 - (i * 0.2)
                ax.text(0.5, y_pos, f"{step}: {status}", ha="center", fontsize=12,
                       color=color, fontweight="bold")

            ax.text(0.5, 0.1, f"Result: {likelihood} ({probability}%)",
                   ha="center", fontsize=14, fontweight="bold")
            ax.axis("off")

            # Save
            output_path = Path(output_dir)
            output_path.mkdir(parents=True, exist_ok=True)
            viz_file = output_path / f"{patient_id}_analysis.png"
            plt.savefig(viz_file, dpi=100, bbox_inches="tight")
            plt.close()

            print(f"[VIZ] Saved visualization: {viz_file}", file=sys.stderr)

            result = {
                "component": "visualization",
                "patient_id": patient_id,
                "viz_file": str(viz_file),
                "likelihood": likelihood,
                "probability": probability,
                "status": "completed",
                "message": f"Visualization created for {patient_id}"
            }

            print(json.dumps(result))

        except Exception as e:
            result = {
                "component": "visualization",
                "patient_id": patient_id,
                "status": "failed",
                "error": str(e)
            }
            print(json.dumps(result))
            sys.exit(1)
        EOF
      resources:
        requests:
          memory: 512Mi
          cpu: 500m
        limits:
          memory: 1Gi
          cpu: "1"
