deploymentSpec:
  executors:
    exec-create-visualization-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - create_visualization_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'numpy==1.26.3'\
          \ 'matplotlib==3.8.2'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.14.6' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef create_visualization_op(\n    detection_result: str,\n    patient_id:\
          \ str,\n    output_dir: str\n) -> str:\n    \"\"\"Visualization Component\
          \ - Patient Specific\"\"\"\n    import json\n    import numpy as np\n  \
          \  import matplotlib.pyplot as plt\n    from pathlib import Path\n\n   \
          \ print(f\"[VISUALIZE] Processing: {patient_id}\")\n\n    # Parse detection\
          \ results\n    results = json.loads(detection_result)\n    diagnosis = results['final_diagnosis']\n\
          \n    # Create visualization showing pipeline stages\n    fig, axes = plt.subplots(2,\
          \ 2, figsize=(12, 10))\n    fig.suptitle(f'COVID-19 Pipeline - {patient_id}',\
          \ fontsize=16, fontweight='bold')\n\n    # Pipeline stages\n    stages =\
          \ [\n        (\"Load Data\", \"Data\", \"green\", \"Completed\"),\n    \
          \    (\"Lung Seg\", \"Segment\", \"blue\", \"Completed\"),\n        (\"\
          COVID Detect\", \"Detect\", \"orange\", \"Completed\"),\n        (\"Visualization\"\
          , \"Visual\", \"purple\", \"Completed\")\n    ]\n\n    for idx, (step, short,\
          \ color, status) in enumerate(stages):\n        row, col = divmod(idx, 2)\n\
          \        axes[row, col].text(0.5, 0.5, f'{step}\\n{status}',\n         \
          \                 ha='center', va='center', transform=axes[row, col].transAxes,\n\
          \                          fontsize=14, fontweight='bold', color=color)\n\
          \        axes[row, col].set_title(f'Component {idx+1}')\n        axes[row,\
          \ col].axis('off')\n\n    # COVID results\n    likelihood = diagnosis['likelihood']\n\
          \    probability = diagnosis['probability']\n\n    colors_map = {\n    \
          \    'HIGH': '#FF4444',    # Red\n        'MODERATE': '#FFA500', # Orange\n\
          \        'LOW': '#4CAF50',     # Green\n        'VERY_LOW': '#4CAF50'  #\
          \ Green\n    }\n    color = colors_map.get(likelihood, '#666666')\n\n  \
          \  result_text = f'''COVID-19 Results - {patient_id}\n\nLikelihood: {likelihood}\n\
          Probability: {probability}%\nRecommendation: {diagnosis['recommendation']}\n\
          \nStatus: Pipeline Active'''\n\n    axes[1, 1].text(0.05, 0.5, result_text,\n\
          \                   transform=axes[1, 1].transAxes, fontsize=10,\n     \
          \              color=color, verticalalignment='center', wrap=True)\n   \
          \ axes[1, 1].set_title('Diagnosis Results')\n    axes[1, 1].axis('off')\n\
          \n    plt.tight_layout()\n\n    # Save visualization\n    output_path =\
          \ Path(output_dir) / f\"{patient_id}_pipeline.png\"\n    output_path.parent.mkdir(parents=True,\
          \ exist_ok=True)\n    plt.savefig(output_path, dpi=150, bbox_inches='tight')\n\
          \    plt.close()\n\n    viz_results = {\n        \"component\": \"visualization\"\
          ,\n        \"patient_id\": patient_id,\n        \"visualization_file\":\
          \ str(output_path),\n        \"likelihood\": likelihood,\n        \"pipeline_stages\"\
          : 4,\n        \"status\": \"completed\"\n    }\n\n    return json.dumps(viz_results)\n\
          \n"
        image: python:3.10-slim
        resources:
          cpuLimit: 1.0
          memoryLimit: 2.147483648
          resourceCpuLimit: '1'
          resourceMemoryLimit: 2Gi
