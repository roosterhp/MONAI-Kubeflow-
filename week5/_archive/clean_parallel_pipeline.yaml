        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef generate_parallel_summary_op(\n    patient_1_viz: str,\n    patient_2_viz:\
          \ str,\n    patient_3_viz: str,\n    patient_4_viz: str,\n    output_dir:\
          \ str\n) -> str:\n    \"\"\"Generate Summary Component - All Patients\"\"\
          \"\n    import json\n    from datetime import datetime\n    from pathlib\
          \ import Path\n\n    print(f\"[SUMMARY] Generating parallel processing summary\"\
          )\n\n    viz_results = [\n        json.loads(patient_1_viz),\n        json.loads(patient_2_viz),\n\
          \        json.loads(patient_3_viz),\n        json.loads(patient_4_viz)\n\
          \    ]\n\n    # Count risk levels\n    risk_counts = {\n        \"HIGH\"\
          : sum(1 for v in viz_results if v.get(\"likelihood\") == \"HIGH\"),\n  \
          \      \"MODERATE\": sum(1 for v in viz_results if v.get(\"likelihood\"\
          ) == \"MODERATE\"),\n        \"LOW\": sum(1 for v in viz_results if v.get(\"\
          likelihood\") == \"LOW\"),\n        \"VERY_LOW\": sum(1 for v in viz_results\
          \ if v.get(\"likelihood\") == \"VERY_LOW\")\n    }\n\n    report = {\n \
          \       \"parallel_processing_report\": {\n            \"timestamp\": datetime.now().isoformat(),\n\
          \            \"total_patients\": len(viz_results),\n            \"successful\"\
          : len(viz_results),\n            \"processing_mode\": \"parallel_visual\"\
          ,\n            \"pipeline_architecture\": \"individual_components_per_patient\"\
          \n        },\n        \"workflow_visualization\": {\n            \"description\"\
          : \"4 Patients with Individual Component Tracking\",\n            \"pipeline_per_patient\"\
          : [\n                \"1. Load Data (load_patient_data_op)\",\n        \
          \        \"2. Lung Segmentation (segment_lungs_op)\",\n                \"\
          3. COVID Detection (detect_covid_op)\",\n                \"4. Visualization\
          \ (create_visualization_op)\"\n            ],\n            \"total_components\"\
          : 16,  # 4 patients \xD7 4 components\n            \"component_separation\"\
          : True\n        },\n        \"patients\": [{\"patient_id\": v.get(\"patient_id\"\
          ), \"component\": v.get(\"component\"), \"likelihood\": v.get(\"likelihood\"\
          )} for v in viz_results],\n        \"risk_distribution\": risk_counts,\n\
          \        \"kubeflow_ui_display\": {\n            \"total_components\": 16,\n\
          \            \"component_types\": 4,\n            \"patients_processed\"\
          : 4,\n            \"clear_separation\": \"Each component type shows as separate\
          \ task\"\n        }\n    }\n\n    # Save report\n    output_path = Path(output_dir)\
          \ / \"parallel_summary_report.json\"\n    output_path.parent.mkdir(parents=True,\
          \ exist_ok=True)\n\n    with open(output_path, 'w') as f:\n        json.dump(report,\
          \ f, indent=2)\n\n    return json.dumps({\"status\": \"completed\", \"report_file\"\
          : str(output_path)})\n\n"
