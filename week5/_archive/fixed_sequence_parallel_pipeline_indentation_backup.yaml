deploymentSpec:
  executors:
    exec-create-visualization-op:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - create_visualization_op
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'numpy==1.26.3'\
          \ 'matplotlib==3.8.2'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.14.6' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef create_visualization_op(\n    detection_result: str,\n    patient_id:\
          \ str,\n    output_dir: str\n) -> str:\n    \"\"\"Create Visualization -\
          \ Memory Optimized\"\"\"\n    import json\n    import numpy as np\n    import\
          \ matplotlib\n    matplotlib.use('Agg')\n    import matplotlib.pyplot as\
          \ plt\n    from pathlib import Path\n\n    print(f\"[VIZ] Creating visualization\
          \ for: {patient_id}\")\n    print(f\"[VIZ] Position 4 in sequence\")\n\n\
          \    try:\n        detect_data = json.loads(detection_result)\n        if\
          \ detect_data.get(\"status\") != \"completed\":\n            raise ValueError(f\"\
          COVID detection failed: {detect_data.get('error', 'Unknown error')}\")\n\
          \n        diagnosis = detect_data.get('final_diagnosis', {})\n        likelihood\
          \ = diagnosis.get('likelihood', 'UNKNOWN')\n        probability = diagnosis.get('probability',\
          \ 0)\n\n        # Create output directory\n        output_path = Path(output_dir)\n\
          \        output_path.mkdir(parents=True, exist_ok=True)\n\n        # Create\
          \ visualization showing sequential processing\n        fig, axes = plt.subplots(2,\
          \ 2, figsize=(10, 8))\n        fig.suptitle(f'COVID-19 Pipeline - {patient_id}\\\
          n(FIXED Sequential Processing)',\n                     fontsize=12, fontweight='bold')\n\
          \n        # Sequential pipeline stages\n        stages = [\n           \
          \ (\"1. Load Data\", \"\u2705\", \"green\", \"Position 1\"),\n         \
          \   (\"2. Segment Lungs\", \"\u2705\", \"blue\", \"Position 2\"),\n    \
          \        (\"3. Detect COVID\", \"\u2705\", \"orange\", \"Position 3\"),\n\
          \            (\"4. Visualization\", \"\u2705\", \"purple\", \"Position 4\"\
          )\n        ]\n\n        for idx, (step, status, color, pos) in enumerate(stages):\n\
          \            row, col = divmod(idx, 2)\n            axes[row, col].text(0.5,\
          \ 0.6, step,\n                              ha='center', va='center', transform=axes[row,\
          \ col].transAxes,\n                              fontsize=10, fontweight='bold')\n\
          \            axes[row, col].text(0.5, 0.3, status,\n                   \
          \           ha='center', va='center', transform=axes[row, col].transAxes,\n\
          \                              fontsize=14, fontweight='bold', color=color)\n\
          \            axes[row, col].text(0.5, 0.1, pos,\n                      \
          \        ha='center', va='center', transform=axes[row, col].transAxes,\n\
          \                              fontsize=8, style='italic')\n           \
          \ axes[row, col].set_title(f'Step {idx+1}')\n            axes[row, col].axis('off')\n\
          \n        # COVID results\n        colors_map = {\n            'HIGH': '#FF4444',\
          \ 'MODERATE': '#FFA500', 'LOW': '#4CAF50', 'UNKNOWN': '#666666'\n      \
          \  }\n        color = colors_map.get(likelihood, '#666666')\n\n        result_text\
          \ = f'''COVID-19 Results - {patient_id}\n\nLikelihood: {likelihood}\nProbability:\
          \ {probability}%\nRecommendation: {diagnosis.get('recommendation', 'N/A')}\n\
          \nSEQUENTIAL PROCESSING:\n\u2713 1 \u2192 2 \u2192 3 \u2192 4 (enforced)\n\
          \u2713 Load \u2192 Segment \u2192 Detect \u2192 Viz\n\u2713 Cross-patient\
          \ parallelism\n\u2713 Sequence FIXED'''\n\n        axes[1, 1].text(0.05,\
          \ 0.5, result_text,\n                       transform=axes[1, 1].transAxes,\
          \ fontsize=8,\n                       color=color, verticalalignment='center')\n\
          \        axes[1, 1].set_title('Diagnosis Results')\n        axes[1, 1].axis('off')\n\
          \n        plt.tight_layout()\n\n        # Save visualization\n        viz_file\
          \ = output_path / f\"{patient_id}_fixed_sequence.png\"\n        plt.savefig(viz_file,\
          \ dpi=100, bbox_inches='tight', optimize=True)\n        plt.close('all')\n\
          \n        viz_results = {\n            \"component\": \"visualization\"\
          ,\n            \"patient_id\": patient_id,\n            \"detection_status\"\
          : detect_data.get(\"status\"),\n            \"visualization_file\": str(viz_file),\n\
          \            \"likelihood\": likelihood,\n            \"pipeline_type\"\
          : \"fixed_sequential_parallel\",\n            \"sequence_enforced\": True,\n\
          \            \"status\": \"completed\",\n            \"timestamp\": \"2025-11-17T22:00:00Z\"\
          ,\n            \"sequence_position\": 4\n        }\n\n        print(f\"\
          [VIZ] Success for {patient_id} - File saved\")\n        return json.dumps(viz_results,\
          \ indent=2)\n\n    except Exception as e:\n        error_result = {\n  \
          \          \"component\": \"visualization\",\n            \"patient_id\"\
          : patient_id,\n            \"status\": \"failed\",\n            \"error\"\
          : str(e),\n            \"timestamp\": \"2025-11-17T22:00:00Z\"\n       \
          \ }\n        return json.dumps(error_result, indent=2)\n\n"
        image: python:3.10-slim
        resources:
          cpuLimit: 0.5
          memoryLimit: 0.536870912
          resourceCpuLimit: '0.5'
          resourceMemoryLimit: 512Mi
