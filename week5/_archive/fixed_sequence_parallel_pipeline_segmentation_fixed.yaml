        defaultValue: /mnt/data/weekly_input
      output_dir:
        parameterType: STRING
        defaultValue: /mnt/data/hospital_output
  dag:
    tasks:
      load-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-load-data-op
        inputs:
          parameters:
            input_dir:
              componentInputParameter: input_dir
            output_dir:
              componentInputParameter: output_dir
        taskInfo:
          name: load-data
      segment-lungs:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-segment-lungs-op
        dependencies:
        - load-data
        inputs:
          parameters:
            load_result:
              taskOutputParameter:
                outputProducerTask: load-data
                outputName: Output
            patient_id:
              value: lung_001
        taskInfo:
          name: segment-lungs
      detect-covid:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-detect-covid-op
