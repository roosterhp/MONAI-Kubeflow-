        inputs:
          parameters:
            segment_result:
              taskOutputParameter:
                outputProducerTask: segment-lungs
                outputName: Output
            patient_id:
              value: lung_001
        taskInfo:
          name: detect-covid
      create-visualization:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-create-visualization-op
        dependencies:
        - detect-covid
        inputs:
          parameters:
            detection_result:
