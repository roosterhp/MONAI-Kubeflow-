apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: monai-demo-simple-
  namespace: kubeflow
  annotations:
    pipelines.kubeflow.org/pipeline_spec: '{"name": "MONAI Demo Simple", "description": "Simple test to verify Kubeflow is working"}'
spec:
  serviceAccountName: pipeline-runner
  entrypoint: main

  templates:
  - name: main
    steps:
    - - name: step1
        template: hello
    - - name: step2
        template: process
    - - name: step3
        template: complete

  - name: hello
    container:
      image: python:3.10-slim
      command: [python, -c]
      args:
      - |
        print("=" * 50)
        print("🎉 MONAI Demo Pipeline Started!")
        print("=" * 50)
        print("Step 1: Hello from Kubeflow")
        print("Python version check...")
        import sys
        print(f"Python: {sys.version}")
        print("✅ Step 1 Complete!")

  - name: process
    container:
      image: python:3.10-slim
      command: [python, -c]
      args:
      - |
        print("=" * 50)
        print("Step 2: Processing...")
        print("=" * 50)
        print("Installing packages...")
        import subprocess
        subprocess.run(["pip", "install", "-q", "numpy"], check=True)

        print("Testing numpy...")
        import numpy as np
        data = np.array([1, 2, 3, 4, 5])
        print(f"Data: {data}")
        print(f"Mean: {data.mean()}")
        print("✅ Step 2 Complete!")

  - name: complete
    container:
      image: python:3.10-slim
      command: [python, -c]
      args:
      - |
        print("=" * 50)
        print("Step 3: Finalizing...")
        print("=" * 50)
        print("Pipeline Summary:")
        print("  ✅ Hello - Success")
        print("  ✅ Process - Success")
        print("  ✅ Complete - Success")
        print("")
        print("🎉🎉🎉 MONAI DEMO PIPELINE COMPLETED SUCCESSFULLY! 🎉🎉🎉")
        print("=" * 50)
