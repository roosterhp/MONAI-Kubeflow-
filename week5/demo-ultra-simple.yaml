apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: monai-ultra-simple-
  namespace: kubeflow
spec:
  serviceAccountName: pipeline-runner
  entrypoint: main

  # Use k8sapi executor to avoid argoexec issues
  executor:
    k8sapi:
      image: quay.io/argoproj/argoexec:v3.4.0

  templates:
  - name: main
    container:
      image: python:3.10-slim
      command: [sh, -c]
      args:
      - |
        echo "========================================"
        echo "🎉 MONAI Demo Pipeline - Ultra Simple"
        echo "========================================"
        echo ""
        echo "✅ Step 1: Environment Check"
        python3 --version
        echo ""
        echo "✅ Step 2: Quick Test"
        python3 -c "print('Python is working!')"
        python3 -c "print('Math test: 2+2 =', 2+2)"
        echo ""
        echo "✅ Step 3: Complete"
        echo ""
        echo "🎉🎉 DEMO COMPLETED SUCCESSFULLY! 🎉🎉"
        echo "========================================"
