apiVersion: batch/v1
kind: Job
metadata:
  name: monai-demo-job
  namespace: kubeflow
spec:
  template:
    metadata:
      labels:
        app: monai-demo
    spec:
      restartPolicy: Never
      containers:
      - name: monai-test
        image: python:3.10-slim
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "========================================"
          echo "🎉 MONAI Demo - Simple K8s Job"
          echo "========================================"
          echo ""
          echo "✅ Step 1: Environment Check"
          python3 --version
          pip --version
          echo ""
          echo "✅ Step 2: Install numpy (test pip)"
          pip install -q numpy
          echo ""
          echo "✅ Step 3: Test numpy"
          python3 << 'PYEOF'
          import numpy as np
          print("NumPy version:", np.__version__)
          data = np.array([1, 2, 3, 4, 5])
          print("Test data:", data)
          print("Mean:", data.mean())
          print("Sum:", data.sum())
          PYEOF
          echo ""
          echo "✅ Step 4: Test MONAI install (quick)"
          pip install -q --no-deps monai
          python3 -c "import monai; print('MONAI version:', monai.__version__)"
          echo ""
          echo "🎉🎉 DEMO JOB COMPLETED SUCCESSFULLY! 🎉🎉"
          echo "========================================"
          echo ""
          echo "Next: This proves K8s can run MONAI containers!"
          echo "      Now we can fix Argo Workflow or use Jobs for pipeline"
